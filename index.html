body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
body{background-image:radial-gradient(380px 300px at 0% 0%,rgba(124,77,255,.22),transparent 70%),radial-gradient(420px 320px at 100% 130px,rgba(245,179,1,.12),transparent 70%),radial-gradient(520px 380px at 30% 620px,rgba(168,85,247,.14),transparent 70%);background-repeat:no-repeat}
.w{position:relative;z-index:1}
h2,h3,.rk,.kpi b,.hname h1,.syncbtn{font-family:Rajdhani,Inter,system-ui,sans-serif}
.c,.mc{background:rgb(28,21,48);border-color:rgba(255,255,255,.08);border-radius:16px}
.mc{border-left-width:4px}
.hdr{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(28,21,48,.94),rgba(7,11,20,.88));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hdr::after{content:"";position:absolute;top:0;right:0;width:140px;height:140px;background:linear-gradient(225deg,rgba(245,179,1,.18),transparent 70%);border-bottom-left-radius:100%;pointer-events:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hl{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 220px}
.emblem{flex:none;width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,#1e293b,#0b1120);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(0,0,0,.4)}
.emblem img{width:48px;height:48px;object-fit:contain}

.hname{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}.hname h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.6px;color:#fff;line-height:1.1}
.hmeta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:7px;align-items:center}
.tagchip{width:auto;margin:0;padding:4px 9px;font:600 12px ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.12);border-radius:8px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.gamebtn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;font:600 12px Inter,sans-serif;color:#fff;text-decoration:none;background:linear-gradient(135deg,#7c4dff,#a855f7)}
.hbtns{display:flex;gap:8px;align-items:center;flex:none;margin-left:auto}.hbtns button{width:auto;margin:0}
#hb{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:12px;background:rgba(30,41,59,.9);border:1px solid rgba(255,255,255,.12);font-size:13px}
.syncbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 15px;border-radius:12px;border:0;background:linear-gradient(135deg,#7c4dff,#a855f7);color:#fff;font-weight:700;font-size:15px;letter-spacing:.3px;box-shadow:0 6px 18px rgba(124,77,255,.38),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,opacity .15s}
.syncbtn:active{transform:scale(.97)}.syncbtn.wide{width:100%;height:46px;margin:8px 0}.syncbtn.busy{opacity:.8;pointer-events:none}.syncbtn.busy .ic{animation:spin 1s linear infinite}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.syncb{padding:12px 14px;margin-bottom:12px}.sbh{display:flex;align-items:center;gap:9px}.sbh b{flex:1;font-size:16px}.sbh .ic{font-size:18px}
.sx{width:auto;margin:0;padding:4px;background:transparent;opacity:.7}
.sbar{height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin:9px 0 6px}.sbar i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#7c4dff,#a855f7);animation:ind 1.2s infinite ease-in-out}@keyframes ind{0%{margin-left:-40%}100%{margin-left:100%}}
.sst{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.sp{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.07);color:#cbd5e1}
.sp.ok{background:rgba(22,163,74,.2);color:#86efac}.sp.bad{background:rgba(220,38,38,.2);color:#fca5a5}.sp.run{background:rgba(250,204,21,.14);color:#fde68a}
.c.ok{border-color:#16a34a}.c.err{border-color:#dc2626}
.tk{display:flex;align-items:center;gap:6px;margin:10px 0 2px;font-size:12px;color:#fcd34d}.tk.ok{color:#86efac}
.srch{position:relative}.srch .ic{position:absolute;left:13px;top:50%;margin-top:-9px;font-size:16px;z-index:1}.srch input{padding-left:38px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:12px;border-radius:16px;background:rgba(28,21,48,.74);border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.kpi .kt{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:#94a3b8}
.chipi{width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.c-blue{background:rgba(59,130,246,.18)}.c-amber{background:rgba(245,158,11,.18)}.c-emerald{background:rgba(16,185,129,.18)}.c-rose{background:rgba(244,63,94,.2)}.c-slate{background:rgba(148,163,184,.15)}
.kpi b{display:block;font-size:30px;line-height:1.1;margin-top:8px;color:#fff;font-weight:700}.kpi b em{font-style:normal;font-size:14px;color:#94a3b8;font-weight:600}
.kpi small{display:block;margin-top:3px}.kpi.danger{border-color:rgba(244,63,94,.35);background:rgba(76,5,25,.3)}.kpi.danger b{color:#fb7185}

const GH_OWNER='ridostore-id',GH_REPO='Rudal-penceng',GH_REF='main',POLL_MS=10000,SYNC=[['sync-member.yml','Member'],['sync-war.yml','War'],['sync-cwl.yml','CWL']];

try{lastSync=localStorage.getItem('ghLast')||''}catch(e){}

const GH=(path,o={})=>fetch('https://api.github.com'+path,{...o,headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+tok()}});

 e.innerHTML=`<div class="sbh"><i class="ic ic-${o.icon}${o.busy?' spin':''}"></i><b>${o.title}</b><button class="sx" onclick="syncUI(null)" aria-label="Tutup"><i class="ic ic-x"></i></button></div>${o.busy?'<div class="sbar"><i></i></div>':''}${o.sub?`<small>${o.sub}</small>`:''}<div class="sst">${(o.steps||[]).map(s=>`<span class="sp ${s.st}"><i class="ic ${STI[s.st]}"></i>${s.label}</span>`).join('')}</div>`}
const syncCard=()=>`<details class="c" ${syncOpen?'open':''} ontoggle="syncOpen=this.open"><summary><b><i class="ic ic-refresh"></i> Sinkronisasi data</b> <small>· ${lastSync?'terakhir '+lastSync:'ambil data terbaru dari game'}</small></summary><button class="syncbtn wide" onclick="syncNow(this)"><i class="ic ic-refresh"></i><span>Sinkronkan sekarang</span></button><small>Menjalankan sinkron member, war, dan CWL di GitHub, lalu memuat ulang data (sekitar 1–2 menit).</small><div class="tk ${tok()?'ok':''}"><i class="ic ic-${tok()?'check':'warn'}"></i> ${tok()?'Token GitHub tersimpan di perangkat ini':'Belum ada token GitHub'}</div><input id="ght" type="password" placeholder="Tempel token GitHub di sini" autocomplete="off"><div class="row"><button class="g" onclick="saveTok()">Simpan token</button><button class="g" onclick="clearTok()">Hapus token</button></div></details>`;
async function syncNow(btn){
 if(!admin||syncBusy)return;
 if(!tok()){tab='rekap';syncOpen=true;render();return syncUI({icon:'warn',cls:'err',title:'Token GitHub belum disimpan',sub:'Tempel token di bagian Sinkronisasi (tab Rekap), lalu tekan Simpan token.'})}
 syncBusy=true;const bt=()=>document.querySelectorAll('.syncbtn').forEach(b=>b.classList.toggle('busy',syncBusy));bt();
 const t0=new Date(Date.now()-5000).toISOString().slice(0,19)+'Z',steps=SYNC.map(([f,l])=>({f,label:l,st:'wait'}));
 syncUI({icon:'refresh',busy:true,title:'Mengirim perintah…',steps});
 for(const s of steps){try{const r=await GH(`/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${s.f}/dispatches`,{method:'POST',body:JSON.stringify({ref:GH_REF})});if(r.status!==204)s.st='bad'}catch(e){s.st='bad'}}
 const sent=steps.filter(s=>s.st!=='bad'),fin=o=>{syncBusy=false;bt();syncUI(o)};
 if(!sent.length)return fin({icon:'x',cls:'err',title:'Gagal mengirim perintah',sub:'Periksa token (izin Actions: Read and write untuk repo ini) dan nama file workflow.',steps});
 sent.forEach(s=>s.st='run');syncUI({icon:'refresh',busy:true,title:'Menyinkronkan data…',sub:'Biasanya 1–2 menit',steps});
 for(let i=0;i<24;i++){await new Promise(r=>setTimeout(r,POLL_MS));
  try{const r=await GH(`/repos/${GH_OWNER}/${GH_REPO}/actions/runs?event=workflow_dispatch&per_page=20&created=${encodeURIComponent('>='+t0)}`),j=await r.json(),runs=j.workflow_runs||[];
   sent.forEach(s=>{const x=runs.find(y=>String(y.path||'').endsWith(s.f));if(x&&x.status==='completed'){s.st=x.conclusion==='success'?'ok':'bad';s.done=true}});
   if(sent.every(s=>s.done)){await load();const bad=steps.filter(s=>s.st==='bad').length;lastSync=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});try{localStorage.setItem('ghLast',lastSync)}catch(e){}
    return fin(bad?{icon:'warn',cls:'err',title:'Selesai dengan kendala',sub:bad+' langkah gagal. Cek tab Actions di GitHub.',steps}:{icon:'check',cls:'ok',title:'Sinkronisasi selesai',sub:'Data sudah diperbarui · '+lastSync,steps})}
   syncUI({icon:'refresh',busy:true,title:'Menyinkronkan data…',sub:'Biasanya 1–2 menit',steps});
  }catch(e){}}
 await load();fin({icon:'clock',title:'Masih berjalan di GitHub',sub:'Data sudah dimuat ulang. Coba buka lagi beberapa menit lagi.',steps});
}
function kpiGrid(all){const N=all.reduce((t,x)=>t+x.n,0),S=all.reduce((t,x)=>t+x.avg*x.n,0),R=all.reduce((t,x)=>t+x.r,0),B=all.reduce((t,x)=>t+x.bolos,0),act=members.filter(m=>m.status!=='Keluar').length;
 const K=(cls,icon,col,label,val,sub,click)=>`<div class="kpi ${cls}" ${click?`onclick="${click}" style="cursor:pointer"`:''}><div class="kt"><span>${label}</span><i class="chipi ${col}"><i class="ic ic-${icon}"></i></i></div><b>${val}</b><small>${sub}</small></div>`;
 return`<div class="kpis">${K('','users','c-blue','Anggota aktif',act+'<em> / 50</em>',(members.length-act)+' sudah keluar',"tab='mem';render()")}${K('','star','c-amber','Rata-rata bintang',N?(S/N).toFixed(2):'-','dari '+N+' serangan war')}${K('','target','c-emerald','Serangan 3★',N?Math.round(R/N*100)+'%':'-',R+' dari '+N+' serangan')}${K(B?'danger':'','warn',B?'c-rose':'c-slate','Bolos (30 hari)',B,B?'serangan tidak dipakai':'semua serangan terpakai')}</div>`}
function periodeInfo(){const ra=attacks.filter(a=>recent(a)&&a.jenis!=='cwl'),nw=new Set(ra.map(adate)).size;return`<div class="c"><small><i class="ic ic-calendar"></i> Periode: ${fmtD(cutoff())} – ${fmtD(today())} (${RETENSI} hari terakhir) · ${nw} war · ${ra.length} serangan war biasa (CWL tidak dihitung). Data lebih lama dihapus otomatis.</small></div>`}

async function all(t){let o=[],i=0;for(;;){const{data,error}=await sb.from(t).select('*').order('created_at').order('id').range(i,i+999);if(error)throw error;o=o.concat(data);if(data.length<1000)return o;i+=1000}}
async function load(){try{[members,attacks]=await Promise.all([all('coc_members'),all('coc_attacks')]);try{cwlHasil=await all('coc_cwl_hasil')}catch(e){cwlHasil=[]}try{peserta=await all('coc_peserta')}catch(e){peserta=[]}try{roster=await all('coc_roster')}catch(e){roster=[]}try{const{data}=await sb.from('coc_settings').select('*').eq('id',1).maybeSingle();if(data)cfg={min:data.min_attacks,pct:data.min_pct}}catch(e){}render()}catch(e){alert('Gagal memuat: '+e.message)}}

function calc(){
 const ra=attacks.filter(a=>recent(a)&&a.jenis!=='cwl');
 const rp=peserta.filter(p=>p.selesai&&p.jenis!=='cwl'&&recent(p));
 const s=members.map(m=>{const mp=rp.filter(p=>p.member_id===m.id),a=ra.filter(x=>x.member_id===m.id),n=a.length,c=k=>a.filter(x=>x.stars===k).length;
  return{m,n,r:c(3),c2:c(2),c1:c(1),c0:c(0),avg:n?a.reduce((t,x)=>t+x.stars,0)/n:0,avgp:n?a.reduce((t,x)=>t+(x.percent||0),0)/n:0,pr:n?c(3)/n:0,avgd:avgDur(a),ikut:mp.length,bolos:mp.reduce((t,p)=>t+Math.max(0,p.maks-p.dipakai),0)}});
 const el=s.filter(x=>x.m.status!=='Keluar'&&x.n>=cfg.min).sort((a,b)=>b.avg-a.avg||b.avgp-a.avgp);
 el.forEach((x,i)=>x.rank=i+1);
 s.forEach(x=>x.rec=x.m.status==='Keluar'?'Sudah keluar':x.n<cfg.min?'Data kurang':x.pr*100>=cfg.pct?'Prioritas CWL':'Cadangan');
 return[...el,...s.filter(x=>!x.rank).sort((a,b)=>b.n-a.n)];
}

}

 const medal=i=>i==1?'🥇':i==2?'🥈':i==3?'🥉':'#'+i;

 lastTxt.top=`*Rekap War ${KLAN}*\nPeriode ${fmtD(cutoff())} – ${fmtD(today())}\n\n`+(top.map(x=>`${x.rank}. ${x.m.name} (${x.m.tag}) ⭐${x.avg.toFixed(2)} 🎯${Math.round(x.avgp)}% 3★${x.r}×${x.bolos?` ⚠️${x.bolos} bolos`:''}`).join('\n')||'Belum ada data');
 const cards=all.filter(x=>hit(x.m)).map(x=>{const inR=inRoster(x.m.id);return`<div class="mc ${x.rank&&x.rank<=15?'t15':x.rank&&x.rank<=30?'t30':''}"><div class="rk">${x.rank?medal(x.rank):'–'}</div><div class="mi"><b>${esc(x.m.name)}</b> <span class="badge ${BC[x.rec]||'b-gray'}">${x.rec}</span>${inR?' <span class="badge b-cwl">Roster</span>':''}<br><small>${esc(x.m.tag)}${x.m.th?' · TH'+x.m.th:''}</small><div class="st"><span><i class="ic ic-swords"></i> ${x.n} serangan</span><span><i class="ic ic-star"></i> ${x.n?x.avg.toFixed(2):'-'}</span><span><i class="ic ic-target"></i> ${x.n?x.avgp.toFixed(0)+'%':'-'}</span><span>3★ ${x.r}×</span><span><i class="ic ic-timer"></i> ${fmtDur(x.avgd)}</span>${x.ikut?`<span><i class="ic ic-clipboard"></i> ikut ${x.ikut} war</span>`:''}${x.bolos?`<span class="warn"><i class="ic ic-warn"></i> bolos ${x.bolos}×</span>`:''}</div><div class="bar"><i style="width:${x.n?Math.round(x.pr*100):0}%"></i></div><small>${x.n?Math.round(x.pr*100)+'% serangan rata (3★)':'Belum ada serangan'}</small>${admin?`<div class="act"><button class="${inR?'g':''}" onclick="toggleRoster('${x.m.id}')">${inR?'✔ Di roster · keluarkan':'<i class="ic ic-plus"></i> Masukkan ke roster CWL'}</button></div>`:''}</div></div>`}).join('');
 return`${kpiGrid(all)}${periodeInfo()}<details class="c" ${cfgOpen?'open':''} ontoggle="cfgOpen=this.open"><summary><b><i class="ic ic-sliders"></i> Pengaturan penilaian</b> <small>· min. ${cfg.min} serangan · min. ${cfg.pct}% rata</small></summary><div class="row"><div><small>Minimal serangan dinilai</small><input type="number" min="1" value="${cfg.min}" ${admin?'':'disabled'} onchange="setCfg('min',this.value)"></div><div><small>Minimal % rata (Prioritas)</small><input type="number" min="0" max="100" value="${cfg.pct}" ${admin?'':'disabled'} onchange="setCfg('pct',this.value)"></div></div><small>Rata = 3 bintang. Hijau = 15 teratas, kuning = 16–30.${admin?'':' Angka ini diatur oleh admin.'}</small></details>${admin?syncCard():''}<div class="act2">${copyBtns('top')}</div><div class="list">${cards||'<div class="c"><i class="ic ic-leaf"></i> Belum ada data</div>'}</div>`;
}

function vAtk(){
 const opts=members.filter(m=>m.status!=='Keluar').map(m=>`<option value="${m.id}" ${m.id==last.m?'selected':''}>${esc(m.name)} ${esc(m.tag)}</option>`).join('');
 const by=Object.fromEntries(members.map(m=>[m.id,m]));

 rows.forEach(r=>{const t=normTag(g(r,'tagar'));if(t&&!known.has(t)&&g(r,'nama'))nm.set(t,{name:g(r,'nama'),tag:t})});
 if(nm.size){const{error}=await sb.from('coc_members').upsert([...nm.values()],{onConflict:'tag'});if(error)return alert(error.message);members=await all('coc_members')}
 const byTag=Object.fromEntries(members.map(m=>[m.tag,m.id])),byName=Object.fromEntries(members.map(m=>[m.name.toLowerCase(),m.id]));
 let skip=0;const out=[];
 rows.forEach(r=>{const id=byTag[normTag(g(r,'tagar'))]||byName[g(r,'nama').toLowerCase()],s=parseInt(g(r,'bintang'));
  if(!id||!(s>=0&&s<=3)){skip++;return}const p=parseInt(g(r,'persen'));
  out.push({member_id:id,war_date:fixD(g(r,'tanggal')),opponent:g(r,'lawan')||null,attack_no:[1,2].includes(+g(r,'serangan'))?+g(r,'serangan'):null,stars:s,percent:p>=0&&p<=100?p:null,jenis:(g(r,'jenis')||'').toLowerCase()==='cwl'?'cwl':'war',target:parseInt(g(r,'target'))||null,durasi:(()=>{const t=parseDur(g(r,'waktu')||g(r,'durasi'));return Number.isNaN(t)?null:t})()})});
 for(let i=0;i<out.length;i+=500){const{error}=await sb.from('coc_attacks').insert(out.slice(i,i+500));if(error)return alert(error.message)}
 await load();alert(out.length+' serangan diimpor, '+skip+' dilewati')}
let lastY=0,lockUntil=0;
function navMin(v){document.body.classList.toggle('nav-min',v)}
function navOpen(){navMin(false);lockUntil=Date.now()+900}
addEventListener('scroll',()=>{const y=scrollY,d=y-lastY;lastY=y;if(Date.now()<lockUntil)return;if(y<60||d<-8)navMin(false);else if(d>8)navMin(true)},{passive:true});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
