<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#120d1f;color:#e6edf6}

input,select,button{font:inherit;padding:9px;border-radius:7px;border:1px solid #4a3877;background:#120d1f;color:#e6edf6;width:100%;margin:3px 0}
button{background:#7c4dff;border:0;font-weight:bold;cursor:pointer}button.g{background:#4a3877}button.r{background:#c0392b;width:auto;padding:5px 9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{padding:10px 4px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{border:1px solid #4a3877;padding:6px;text-align:center}
th{background:#2b1f4d;position:sticky;top:0}td.l{text-align:left}.top{background:#1d4d32}.mid{background:#4d4420}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hd button{width:auto;padding:7px 12px}
.e{color:#ff7b72;min-height:18px}input:disabled{opacity:.55}.tabs{transition:transform .28s ease,opacity .2s}body.nav-min .tabs{transform:translateY(130%);opacity:0;pointer-events:none}.pill{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;width:auto;margin:0;padding:9px 24px 9px 14px;border-radius:99px;background:#0d1822;border:2px solid #0e7490;color:#22d3ee;font-weight:bold;font-size:19px;box-shadow:0 0 18px #22d3ee33;transition:transform .28s ease,opacity .2s;z-index:6}.pill svg{flex:none}body.nav-min .pill{transform:translate(-50%,0);opacity:1;pointer-events:auto}.w{padding-bottom:96px}body{font-size:15px}.r{padding:9px 13px}.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#150f26;border-top:1px solid #3a2a5e;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}.tabs button{background:transparent;color:#b3a6d9;font-size:11px;margin:0;padding:6px 2px;border-radius:10px;line-height:1.3}.tabs button .ic{display:block;font-size:20px}.tabs button.on{background:#2b1f4d;color:#f5b301}.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:#2b1f4d;color:#cbb8ff}#app.adm .chip{background:#f5b301;color:#1a1200;font-weight:bold}#app.adm{border-top:3px solid #f5b301}.mc{display:flex;gap:10px;background:#1c1530;border:1px solid #3a2a5e;border-left:4px solid #3a2a5e;border-radius:12px;padding:10px 12px;margin-bottom:8px}.mc.t15{border-left-color:#22c55e}.mc.t30{border-left-color:#f5b301}.mc.out{opacity:.65}.rk{font-size:22px;min-width:42px;text-align:center;font-weight:bold;color:#f5b301}.mi{flex:1;min-width:0}.st{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 6px;font-size:13px}.bar{height:6px;border-radius:4px;background:#2b1f4d;overflow:hidden;margin-bottom:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c4dff,#f5b301)}.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:bold;vertical-align:middle}.b-green{background:#14532d;color:#86efac}.b-yellow{background:#713f12;color:#fde68a}.b-gray{background:#3a3550;color:#cbd5e1}.b-red{background:#7f1d1d;color:#fca5a5}.chs{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}.ch{width:auto;margin:0;padding:7px 14px;border-radius:99px;background:#2b1f4d;font-size:13px}.ch.on{background:#7c4dff}.act{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}.act select{width:auto;margin:0;padding:8px}.act button{width:auto;margin:0;padding:8px 12px}@media(min-width:720px){.list{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}}details.c summary{cursor:pointer;list-style:none}details.c summary::-webkit-details-marker{display:none}details.c summary::before{content:'▸ '}details.c[open]>summary::before{content:'▾ '}details.c[open]>summary{margin-bottom:8px}small{color:#b3a6d9}
</style></head><body>
<div class="w" id="login" hidden><div class="c" style="text-align:center"><img src="logo.png" alt="Rudal Penceng" style="width:220px;max-width:75%;display:block;margin:0 auto 6px"><h2>Rekap dan Data Member Rudal Penceng</h2>
<form id="lf"><input id="em" type="email" placeholder="Email" required autocomplete="username">
<input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
<button>Masuk</button></form><button class="g" type="button" onclick="backPublic()">Kembali ke tampilan publik</button><div class="e" id="le"></div></div></div>
<div class="w" id="app" hidden>
<div class="hd"><div style="display:flex;align-items:center;gap:10px;min-width:0"><img src="logo.png" alt="Rudal Penceng" style="width:52px;height:52px;flex:none"><h2 style="margin:0">Rekap dan Data Member Rudal Penceng</h2></div><button class="g" id="hb">Login Admin</button></div>
<div style="margin:-4px 0 10px"><span id="mode" class="chip"></span></div>
<div class="c" id="clan" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><small>Tagar Klan</small><div style="font-size:20px;font-weight:bold;letter-spacing:1px">#2UQ9UG0Y9</div></div><div style="display:flex;gap:8px;align-items:center"><button class="g" id="cb" style="width:auto;padding:8px 12px" onclick="copyTag()">Salin</button><a href="https://link.clashofclans.com/en?action=OpenClanProfile&tag=2UQ9UG0Y9" target="_blank" rel="noopener" style="background:#7c4dff;color:#fff;padding:9px 12px;border-radius:7px;text-decoration:none;font-weight:bold">Buka di game</a></div></div>
<div class="tabs" id="tabs"></div><input id="sq" placeholder="🔍 Cari nama atau tagar, mis. #R9QYUGJYV" oninput="q=this.value;render()" autocomplete="off"><div id="view"><div class="c">⏳ Memuat data…</div></div>
<button id="navpill" class="pill" onclick="navOpen()" aria-label="Menu"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z" fill="currentColor"/></svg><span>Menu</span></button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://taffistnkxpbutvwxeyo.supabase.co';
const SUPABASE_KEY='sb_publishable_v0AlfdNusuQUBDIsNWR-Aw_VkcuDOIR'; // Project Settings > API Keys > anon / publishable key
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let members=[],attacks=[],q='',tab='rekap',loaded=false,last={d:new Date().toISOString().slice(0,10),o:'',m:''};
let cfg={min:2,pct:60};
const TABS=[['rekap','Rekap'],['atk','Serangan'],['mem','Member'],['csv','CSV']];
const normTag=t=>{t=String(t||'').toUpperCase().replace(/\s/g,'').replace(/O/g,'0');return t?(t[0]=='#'?t:'#'+t):''};
const CLAN_TAG='#2UQ9UG0Y9';
const hit=m=>{const k=q.trim().toLowerCase().replace(/^#/,'');if(!k)return true;return String(m.name||'').toLowerCase().includes(k)||String(m.tag||'').toLowerCase().replace('#','').includes(k.replace(/o/g,'0'))};
function copyTag(){const b=$('cb'),done=()=>{b.textContent='Tersalin ✓';setTimeout(()=>{b.textContent='Salin'},1500)};function fb(){const t=document.createElement('textarea');t.value=CLAN_TAG;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){}t.remove()}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(CLAN_TAG).then(done,fb)}else fb()}
const RETENSI=30;
const wib=ms=>new Date(ms+7*36e5).toISOString().slice(0,10);
const cutoff=()=>wib(Date.now()-RETENSI*864e5),today=()=>wib(Date.now());
const adate=a=>a.war_date||String(a.created_at||'').slice(0,10);
const recent=a=>adate(a)>=cutoff();
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtD=d=>{const m=String(d).match(/^(\d{4})-(\d\d)-(\d\d)/);return m?(+m[3])+' '+BLN[+m[2]-1]+' '+m[1]:'Tanpa tanggal'};
function periodeInfo(){const ra=attacks.filter(recent),nw=new Set(ra.map(adate)).size;return`<div class="c"><small>📅 Periode: ${fmtD(cutoff())} – ${fmtD(today())} (${RETENSI} hari terakhir) · ${nw} war · ${ra.length} serangan. Data lebih lama dihapus otomatis.</small></div>`}

async function all(t){let o=[],i=0;for(;;){const{data,error}=await sb.from(t).select('*').order('created_at').order('id').range(i,i+999);if(error)throw error;o=o.concat(data);if(data.length<1000)return o;i+=1000}}
async function load(){try{[members,attacks]=await Promise.all([all('coc_members'),all('coc_attacks')]);try{const{data}=await sb.from('coc_settings').select('*').eq('id',1).maybeSingle();if(data)cfg={min:data.min_attacks,pct:data.min_pct}}catch(e){}render()}catch(e){alert('Gagal memuat: '+e.message)}}

if(SUPABASE_KEY.startsWith('ISI_'))setTimeout(()=>$('le').textContent='Anon key Supabase belum diisi di index.html',300);
$('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)$('le').textContent='Email atau password salah'};
let admin=false;
function showLogin(){$('app').hidden=true;$('login').hidden=false}
function backPublic(){$('login').hidden=true;$('app').hidden=false}
sb.auth.onAuthStateChange((ev,s)=>{const a=!!s;if(loaded&&a===admin)return;admin=a;loaded=true;backPublic();load()});

function calc(){
 const ra=attacks.filter(recent);
 const s=members.map(m=>{const a=ra.filter(x=>x.member_id===m.id),n=a.length,c=k=>a.filter(x=>x.stars===k).length;
  return{m,n,r:c(3),c2:c(2),c1:c(1),c0:c(0),avg:n?a.reduce((t,x)=>t+x.stars,0)/n:0,avgp:n?a.reduce((t,x)=>t+(x.percent||0),0)/n:0,pr:n?c(3)/n:0}});
 const el=s.filter(x=>x.m.status!=='Keluar'&&x.n>=cfg.min).sort((a,b)=>b.avg-a.avg||b.avgp-a.avgp);
 el.forEach((x,i)=>x.rank=i+1);
 s.forEach(x=>x.rec=x.m.status==='Keluar'?'Sudah keluar':x.n<cfg.min?'Data kurang':x.pr*100>=cfg.pct?'Prioritas CWL':'Cadangan');
 return[...el,...s.filter(x=>!x.rank).sort((a,b)=>b.n-a.n)];
}
function render(){
 if(!admin&&tab=='csv')tab='rekap';
 $('tabs').style.gridTemplateColumns='repeat('+(admin?4:3)+',1fr)';
 $('app').classList.toggle('adm',admin);$('mode').textContent=admin?'🛠️ Mode Admin':'👁️ Mode lihat saja';
 $('sq').style.display=tab=='csv'?'none':'';
 $('hb').textContent=admin?'Keluar':'Login Admin';$('hb').onclick=admin?()=>sb.auth.signOut():showLogin;
 $('tabs').innerHTML=TABS.filter(([k])=>k!=='csv'||admin).map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()"><span class="ic">${({rekap:'🏆',atk:'⚔️',mem:'👥',csv:'📄'})[k]}</span>${l}</button>`).join('');
 $('view').innerHTML={rekap:vRekap,atk:vAtk,mem:vMem,csv:vCsv}[tab]();
}
let cfgOpen=false,mf='all';
function vRekap(){
 const medal=i=>i==1?'🥇':i==2?'🥈':i==3?'🥉':'#'+i;
 const BC={'Prioritas CWL':'b-green','Cadangan':'b-yellow','Data kurang':'b-gray','Sudah keluar':'b-red'};
 const cards=calc().filter(x=>hit(x.m)).map(x=>`<div class="mc ${x.rank&&x.rank<=15?'t15':x.rank&&x.rank<=30?'t30':''}"><div class="rk">${x.rank?medal(x.rank):'–'}</div><div class="mi"><b>${esc(x.m.name)}</b> <span class="badge ${BC[x.rec]||'b-gray'}">${x.rec}</span><br><small>${esc(x.m.tag)}${x.m.th?' · TH'+x.m.th:''}</small><div class="st"><span>⚔️ ${x.n} serangan</span><span>⭐ ${x.n?x.avg.toFixed(2):'-'}</span><span>🎯 ${x.n?x.avgp.toFixed(0)+'%':'-'}</span><span>3★ ${x.r}×</span></div><div class="bar"><i style="width:${x.n?Math.round(x.pr*100):0}%"></i></div><small>${x.n?Math.round(x.pr*100)+'% serangan rata (3★)':'Belum ada serangan'}</small></div></div>`).join('');
 return`${periodeInfo()}<details class="c" ${cfgOpen?'open':''} ontoggle="cfgOpen=this.open"><summary><b>⚙️ Pengaturan penilaian</b> <small>· min. ${cfg.min} serangan · min. ${cfg.pct}% rata</small></summary><div class="row"><div><small>Minimal serangan dinilai</small><input type="number" min="1" value="${cfg.min}" ${admin?'':'disabled'} onchange="setCfg('min',this.value)"></div><div><small>Minimal % rata (Prioritas)</small><input type="number" min="0" max="100" value="${cfg.pct}" ${admin?'':'disabled'} onchange="setCfg('pct',this.value)"></div></div><small>Rata = 3 bintang. Hijau = 15 teratas, kuning = 16–30.${admin?'':' Angka ini diatur oleh admin.'}</small></details><div class="list">${cards||'<div class="c">🌱 Belum ada data</div>'}</div>`;
}
async function setCfg(k,v){if(!admin)return render();const old={...cfg};cfg[k]=Math.max(0,+v||0);const{error}=await sb.from('coc_settings').upsert({id:1,min_attacks:cfg.min,min_pct:cfg.pct});if(error){alert('Gagal menyimpan pengaturan: '+error.message);cfg=old}render()}
function vAtk(){
 const opts=members.filter(m=>m.status!=='Keluar').map(m=>`<option value="${m.id}" ${m.id==last.m?'selected':''}>${esc(m.name)} ${esc(m.tag)}</option>`).join('');
 const by=Object.fromEntries(members.map(m=>[m.id,m]));
 const ra=attacks.filter(recent).filter(a=>by[a.member_id]&&hit(by[a.member_id])),wars={};
 ra.forEach(a=>{(wars[adate(a)]=wars[adate(a)]||[]).push(a)});
 const cards=Object.keys(wars).sort().reverse().map((k,i)=>{const d=k,L=wars[k].slice().sort((x,y)=>String(by[x.member_id].name).localeCompare(by[y.member_id].name)||(x.attack_no||0)-(y.attack_no||0)),o=(wars[k].find(x=>x.opponent)||{}).opponent||'';
  const st=L.reduce((t,x)=>t+x.stars,0),r3=L.filter(x=>x.stars===3).length;
  const rows=L.map(a=>`<tr><td class="l">${esc(by[a.member_id].name)}</td><td>${a.attack_no||''}</td><td>${a.stars}★</td><td>${a.percent??''}</td>${admin?`<td><button class="r" onclick="delRow('coc_attacks','${a.id}')">✕</button></td>`:''}</tr>`).join('');
  return`<details class="c" ${i<1||q?'open':''}><summary><b>${fmtD(d)}</b>${o?' vs '+esc(o):''}<br><small>${L.length} serangan · ${r3} rata (3★) · rata-rata ${(st/L.length).toFixed(2)}★</small></summary><div class="sc"><table style="min-width:0"><tr><th>Nama</th><th>Ke-</th><th>Bintang</th><th>%</th>${admin?'<th></th>':''}</tr>${rows}</table></div></details>`}).join('');
 return(admin?`<div class="c"><h2>Tambah serangan</h2><div class="row"><input type="date" id="ad" value="${last.d}"><input id="ao" placeholder="Lawan clan" value="${esc(last.o)}"></div>
 <select id="am"><option value="">Pilih member</option>${opts}</select>
 <div class="row"><select id="an"><option>1</option><option>2</option></select><select id="as"><option>3</option><option>2</option><option>1</option><option>0</option></select></div>
 <input id="ap" type="number" min="0" max="100" placeholder="Persentase (0-100)"><button onclick="addAtk()">Simpan</button></div>`:'')+`<div class="c"><small>Menampilkan ${RETENSI} hari terakhir, dikelompokkan per war. Data lebih lama dihapus otomatis.</small></div>`+(cards||'<div class="c">Belum ada serangan</div>');
}
async function addAtk(){
 const v=id=>$(id).value;if(!v('am'))return alert('Pilih member dulu');
 last={d:v('ad'),o:v('ao'),m:v('am')};
 const row={war_date:v('ad')||null,opponent:v('ao')||null,member_id:v('am'),attack_no:+v('an'),stars:+v('as'),percent:v('ap')===''?null:Math.min(100,Math.max(0,+v('ap')))};
 const{data,error}=await sb.from('coc_attacks').insert(row).select();if(error)return alert(error.message);
 attacks.push(...data);render();
}
const ROLEI={Leader:'👑 Leader','Co-Leader':'🛡️ Co-Leader',Elder:'⭐ Elder',Member:'👤 Member'};
function vMem(){
 const all=members.filter(hit),cnt={all:all.length,aktif:all.filter(m=>m.status!=='Keluar').length,keluar:all.filter(m=>m.status==='Keluar').length};
 const L=all.filter(m=>mf=='all'||(mf=='aktif'?m.status!=='Keluar':m.status==='Keluar')).sort((x,y)=>String(x.name).localeCompare(y.name));
 const chips=[['all','Semua'],['aktif','Aktif'],['keluar','Keluar']].map(([k,l])=>`<button class="ch ${mf==k?'on':''}" onclick="mf='${k}';render()">${l} (${cnt[k]})</button>`).join('');
 const cards=L.map(m=>`<div class="mc ${m.status==='Keluar'?'out':''}"><div class="mi"><b>${esc(m.name)}</b> <span class="badge ${m.status==='Keluar'?'b-red':'b-green'}">${m.status}</span><br><small>${esc(m.tag)}${m.th?' · TH'+m.th:''} · ${ROLEI[m.role]||esc(m.role)}</small>${admin?`<div class="act"><select onchange="setRole('${m.id}',this.value)">${['Member','Elder','Co-Leader','Leader'].map(r=>`<option ${r==m.role?'selected':''}>${r}</option>`).join('')}</select><button class="g" onclick="togStat('${m.id}')">${m.status=='Aktif'?'Tandai Keluar':'Tandai Aktif'}</button><button class="r" onclick="delRow('coc_members','${m.id}')">✕</button></div>`:''}</div></div>`).join('');
 return(admin?`<div class="c"><h2>Tambah member</h2><div class="row"><input id="mn" placeholder="Nama"><input id="mt" placeholder="Tagar #P2YLQ8R"></div>
 <div class="row"><input id="mh" type="number" placeholder="Town Hall"><select id="mr"><option>Member</option><option>Elder</option><option>Co-Leader</option><option>Leader</option></select></div>
 <button onclick="addMem()">Simpan</button></div>`:'')+`<div class="chs">${chips}</div><div class="list">${cards||'<div class="c">🌱 Belum ada member</div>'}</div>`;
}
async function addMem(){
 const name=$('mn').value.trim(),tag=normTag($('mt').value);if(!name||!tag)return alert('Nama dan tagar wajib diisi');
 const{data,error}=await sb.from('coc_members').insert({name,tag,th:+$('mh').value||null,role:$('mr').value}).select();
 if(error)return alert(error.code=='23505'?'Tagar sudah ada':error.message);members.push(...data);render();
}
async function setRole(id,r){const m=members.find(x=>x.id==id),old=m.role;const{error}=await sb.from('coc_members').update({role:r}).eq('id',id);if(error){alert(error.message);m.role=old;return render()}m.role=r}
async function togStat(id){const m=members.find(x=>x.id==id),s=m.status=='Aktif'?'Keluar':'Aktif';const{error}=await sb.from('coc_members').update({status:s}).eq('id',id);if(error)return alert(error.message);m.status=s;render()}
async function delRow(t,id){
 if(!confirm(t=='coc_members'?'Hapus member beserta seluruh riwayat serangannya?':'Hapus serangan ini?'))return;
 const{error}=await sb.from(t).delete().eq('id',id);if(error)return alert(error.message);
 if(t=='coc_members'){members=members.filter(x=>x.id!=id);attacks=attacks.filter(x=>x.member_id!=id)}else attacks=attacks.filter(x=>x.id!=id);render();
}
function vCsv(){if(!admin)return'';return`<div class="c"><h2>Ekspor CSV</h2><button onclick="expMem()">Unduh Member</button><button onclick="expAtk()">Unduh Serangan</button><button onclick="expRek()">Unduh Rekap CWL</button></div>
 `+(admin?`<div class="c"><h2>Impor Member</h2><small>Kolom: Nama, Tagar, TownHall, Role, Status. Tagar yang sudah ada diperbarui.</small><input type="file" accept=".csv" onchange="impMem(this)"></div>
 <div class="c"><h2>Impor Serangan</h2><small>Kolom: Tanggal, Lawan, Nama, Tagar, Serangan, Bintang, Persen. Member baru dibuat otomatis jika tagar diisi.</small><input type="file" accept=".csv" onchange="impAtk(this)"></div>`:'')}
function dl(name,rows){const csv='\uFEFF'+rows.map(r=>r.map(v=>{v=String(v??'');return/[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click()}
const expMem=()=>dl('member.csv',[['Nama','Tagar','TownHall','Role','Status'],...members.map(m=>[m.name,m.tag,m.th,m.role,m.status])]);
const expAtk=()=>{const by=Object.fromEntries(members.map(m=>[m.id,m]));dl('serangan.csv',[['Tanggal','Lawan','Nama','Tagar','Serangan','Bintang','Persen'],...attacks.map(a=>[a.war_date,a.opponent,by[a.member_id]?.name,by[a.member_id]?.tag,a.attack_no,a.stars,a.percent])])};
const expRek=()=>dl('rekap_cwl.csv',[['Peringkat','Nama','Tagar','Serangan','Rata','Persen Rata','Avg Bintang','Avg Persen','Rekomendasi'],...calc().map(x=>[x.rank||'',x.m.name,x.m.tag,x.n,x.r,x.n?Math.round(x.pr*100):'',x.n?x.avg.toFixed(2):'',x.n?x.avgp.toFixed(1):'',x.rec])]);
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const l=t.split('\n')[0],d=(l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?';':',';const R=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==d){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))R.push(r);r=[]}else f+=c}
 r.push(f);if(r.some(x=>x.trim()))R.push(r);return R}
async function readCsv(inp){const f=inp.files[0];if(!f)return null;const R=parseCSV(await f.text());inp.value='';if(R.length<2){alert('File kosong');return null}
 const H=R[0].map(h=>h.toLowerCase().replace(/[^a-z]/g,''));return{rows:R.slice(1),col:k=>H.findIndex(h=>h.startsWith(k))}}
async function impMem(inp){const x=await readCsv(inp);if(!x)return;const{rows,col}=x,ci=n=>col(n),g=(r,n)=>(r[ci(n)]||'').trim();
 const roles=['Member','Elder','Co-Leader','Leader'];
 const out=rows.map(r=>({name:g(r,'nama'),tag:normTag(g(r,'tagar')),th:+g(r,'town')||+g(r,'th')||null,role:roles.find(z=>z.toLowerCase()==g(r,'role').toLowerCase())||'Member',status:g(r,'status').toLowerCase()=='keluar'?'Keluar':'Aktif'})).filter(r=>r.name&&r.tag);
 const{error}=await sb.from('coc_members').upsert(out,{onConflict:'tag'});if(error)return alert(error.message);await load();alert(out.length+' member diimpor')}
async function impAtk(inp){const x=await readCsv(inp);if(!x)return;const{rows,col}=x,g=(r,n)=>(r[col(n)]||'').trim();
 const fixD=s=>{let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:(/^\d{4}-\d{2}-\d{2}$/.test(s)?s:null)};
 const known=new Set(members.map(m=>m.tag)),nm=new Map();
 rows.forEach(r=>{const t=normTag(g(r,'tagar'));if(t&&!known.has(t)&&g(r,'nama'))nm.set(t,{name:g(r,'nama'),tag:t})});
 if(nm.size){const{error}=await sb.from('coc_members').upsert([...nm.values()],{onConflict:'tag'});if(error)return alert(error.message);members=await all('coc_members')}
 const byTag=Object.fromEntries(members.map(m=>[m.tag,m.id])),byName=Object.fromEntries(members.map(m=>[m.name.toLowerCase(),m.id]));
 let skip=0;const out=[];
 rows.forEach(r=>{const id=byTag[normTag(g(r,'tagar'))]||byName[g(r,'nama').toLowerCase()],s=parseInt(g(r,'bintang'));
  if(!id||!(s>=0&&s<=3)){skip++;return}const p=parseInt(g(r,'persen'));
  out.push({member_id:id,war_date:fixD(g(r,'tanggal')),opponent:g(r,'lawan')||null,attack_no:[1,2].includes(+g(r,'serangan'))?+g(r,'serangan'):null,stars:s,percent:p>=0&&p<=100?p:null})});
 for(let i=0;i<out.length;i+=500){const{error}=await sb.from('coc_attacks').insert(out.slice(i,i+500));if(error)return alert(error.message)}
 await load();alert(out.length+' serangan diimpor, '+skip+' dilewati')}
let lastY=0,lockUntil=0;
function navMin(v){document.body.classList.toggle('nav-min',v)}
function navOpen(){navMin(false);lockUntil=Date.now()+900}
addEventListener('scroll',()=>{const y=scrollY,d=y-lastY;lastY=y;if(Date.now()<lockUntil)return;if(y<60||d<-8)navMin(false);else if(d>8)navMin(true)},{passive:true});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
